<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · Bus Timings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<script>try{var t=localStorage.getItem('bt-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>

<body>
<header class="top">
  <div class="in">
    <span class="brand"><span class="logo"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21v-4M16 21v-4M8 14h.01M16 14h.01"/></svg></span>Bus Timings Admin</span>
    <div class="h-right">
      <button id="themeBtn" class="btn btn-s btn-sm" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
      <button class="btn btn-s btn-sm" onclick="changePw()" title="Change admin password">Password</button>
      <span id="who" class="row"></span>
    </div>
  </div>
</header>
<main id="app" class="wrap wide page"></main>
<div id="modal" class="modal"></div>
<div id="sheet" class="sheet"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script src="/js/shared.js"></script>
<script src="/js/admin.js"></script>

</html>
